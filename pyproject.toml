[project]
name = "egress-proxy"
version = "0.1.0"
description = "Authenticated egress proxy server with a drop-in httpx client"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "botifyex" }]
keywords = ["httpx", "proxy", "egress", "transport", "starlette"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
client = [
    "httpx>=0.28.1",
]
server = [
    "httpx[http2]>=0.28.1",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "uvicorn>=0.50.0",
]

[project.scripts]
egress-proxy = "egress_proxy.server.main:run"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "egress-proxy[client,server]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["egress_proxy"]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
