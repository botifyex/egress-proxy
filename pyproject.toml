[project]
name = "egress-proxy"
version = "0.4.0"
description = "Self-hosted egress proxy with drop-in integrations for Python HTTP clients and upstream HTTP/SOCKS rotation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "botifyex" }]
keywords = ["httpx", "aiohttp", "proxy", "egress", "socks5", "http-proxy", "proxy-rotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/botifyex/egress-proxy"
Repository = "https://github.com/botifyex/egress-proxy"
Issues = "https://github.com/botifyex/egress-proxy/issues"
Changelog = "https://github.com/botifyex/egress-proxy/blob/master/CHANGELOG.md"

[project.optional-dependencies]
client-httpx = [
    "httpx>=0.25.1,<1",
    "sniffio>=1.3.0",
]
client-aiohttp = [
    "aiohttp>=3.13.0",
    "yarl>=1.21.0",
]
client = [
    "egress-proxy[client-httpx,client-aiohttp]",
]
server = [
    "aiohttp>=3.13.0",
    "aiohttp-socks>=0.11.0",
    "certifi>=2024.7.4",
    "httptools>=0.7.1",
    "pydantic-settings>=2.0.0",
    "python-socks>=2.4.3",
    "uvicorn>=0.24.0",
    "yarl>=1.21.0",
]
all = [
    "egress-proxy[client,server]",
]

[project.scripts]
egress-proxy = "egress_proxy.command:run"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "egress-proxy[all]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "starlette>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["egress_proxy"]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/egress_proxy/client/*/__init__.py" = ["E402"]

[tool.basedpyright]
include = ["src", "tests", "benchmarks"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.bumpversion]
current_version = "0.4.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore(release): v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'
regex = true

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "egress-proxy"
version = "{current_version}""""
replace = """
name = "egress-proxy"
version = "{new_version}""""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/botifyex/egress-proxy/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/botifyex/egress-proxy/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/botifyex/egress-proxy/compare/v{current_version}...v{new_version}"""
