name: CI

on:
  push:
    branches: [master]
    paths-ignore: &ignored
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore: *ignored
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: lint
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks
      - run: uv run ruff format --check src tests benchmarks
      - run: uv run basedpyright

  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.dependencies.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        dependencies:
          - name: lowest
            arguments: --resolution lowest-direct
          - name: latest
            arguments: --upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          cache-suffix: ${{ matrix.dependencies.name }}
      - run: uv sync ${{ matrix.dependencies.arguments }}
      - run: uv run --no-sync pytest --cov --cov-report=term-missing

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: egress-proxy:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - run: tests/image.sh egress-proxy:ci

  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: package
      - run: uv build
      - name: Each client extra installs only its own library
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "egress-proxy[client-httpx] @ ./$wheel" \
            python -c "import egress_proxy.client.httpx; import importlib.util as u; assert u.find_spec('aiohttp') is None"
          uv run --isolated --no-project --with "egress-proxy[client-aiohttp] @ ./$wheel" \
            python -c "import egress_proxy.client.aiohttp; import importlib.util as u; assert u.find_spec('httpx') is None"
          uv run --isolated --no-project --with "egress-proxy[client] @ ./$wheel" \
            python -c "import egress_proxy.client.httpx, egress_proxy.client.aiohttp"
      - name: Server extra provides the command
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "egress-proxy[server] @ ./$wheel" egress-proxy --help
      - name: Command without the server extra names the extra to install
        run: |
          wheel=$(ls dist/*.whl)
          if output=$(uv run --isolated --no-project --with "egress-proxy[client-httpx] @ ./$wheel" egress-proxy --help 2>&1); then
            echo "::error::egress-proxy started without the server extra"
            exit 1
          fi
          grep -F "pip install 'egress-proxy[server]'" <<<"$output"
          if grep -q Traceback <<<"$output"; then
            echo "::error::egress-proxy printed a traceback instead of a message"
            exit 1
          fi
