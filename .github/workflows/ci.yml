name: CI

on:
  push:
    branches: [master]
    paths-ignore: &ignored
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore: *ignored
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks
      - run: uv run ruff format --check src tests benchmarks

  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.dependencies.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        dependencies:
          - name: lowest
            arguments: --resolution lowest-direct
          - name: latest
            arguments: --upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync ${{ matrix.dependencies.arguments }}
      - run: uv run --no-sync pytest --cov --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Client extra installs without server dependencies
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "egress-proxy[client] @ ./$wheel" \
            python -c "import egress_proxy.client; import importlib.util as u; assert u.find_spec('aiohttp') is None"
      - name: Server extra provides the command
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "egress-proxy[server] @ ./$wheel" egress-proxy --help
